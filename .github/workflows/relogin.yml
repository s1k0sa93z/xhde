name: Mind Recalls Auto Re-login

on:
  schedule:
    # Runs every 5 minutes. GitHub's scheduler can drift a few minutes
    # under load, so treat "5 minutes" as approximate, not exact.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

jobs:
  relogin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # Restore the saved login session (cookies) from the most recent
      # previous run, if one exists. We always save under a NEW unique key
      # each run, but restore-keys lets us pick up the latest matching one.
      - name: Restore saved session
        uses: actions/cache/restore@v4
        with:
          path: storage_state.json
          key: moodle-session-${{ github.run_id }}
          restore-keys: |
            moodle-session-

      - name: Run login/logout script
        env:
          MINDRECALLS_USERNAME: ${{ secrets.MINDRECALLS_USERNAME }}
          MINDRECALLS_PASSWORD: ${{ secrets.MINDRECALLS_PASSWORD }}
        run: python relogin.py

      # Save the (possibly refreshed) session under a new key so the NEXT
      # run can restore it via the "moodle-session-" prefix above.
      - name: Save session for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: storage_state.json
          key: moodle-session-${{ github.run_id }}
